services:
  app:
    build: .
    container_name: lexintake-app
    ports:
      - "8080:8000"
    environment:
      APP_NAME: "AI Law Firm Intake & Document Agent"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lexintake
      DB_USERNAME: lexintake
      DB_PASSWORD: secret
      MODULE_CONFLICT_CHECK: "true"
      MODULE_MATTER_INTAKE: "true"
      MODULE_DOCUMENT_AI: "true"
      MODULE_ESIGN_READINESS: "true"
      MODULE_CLIENT_PORTAL: "true"
      MODULE_BILLING_NOTES: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.4
    container_name: lexintake-mysql
    environment:
      MYSQL_DATABASE: lexintake
      MYSQL_USER: lexintake
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - lexintake_mysql:/var/lib/mysql

volumes:
  lexintake_mysql: